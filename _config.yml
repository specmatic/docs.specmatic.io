theme: just-the-docs
markdown: kramdown
title: "Specmatic"
specmatic-core-version: 2.38.0
specmatic-jms-version: 0.6.1
specmatic-async-version: 2.2.4
specmatic-kafka-version: 1.7.7
specmatic-studio-version: 1.17.2
specmatic-openapi-version: 1.25.2
specmatic-jdbc-version: 0.12.2
specmatic-redis-version: 0.9.6
specmatic-release-test-version: 0.0.2
specmatic-grpc-version: 0.1.28
specmatic-graphql-version: 1.5.7
specmatic-arazzo-version: 1.6.2
specmatic-google-pubsub-version: 1.6.1
contact_us_url: "https://specmatic.io/contact-us"

spec_cmd: "java -jar /path/to/specmatic.jar"
url: "https://docs.specmatic.io"

aux_links:
  "Specmatic on GitHub":
    - "https://github.com/specmatic/specmatic"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-last-modified-at

logo: "/images/specmatic-logo.png"
favicon_ico: /images/favicon/favicon.ico

redirect_from:
  json: false

exclude:
  - README.md
  - Rakefile
  - CNAME

mermaid:
  path: '/js/mermaid-11.6.0.min.js'
  config:

enable_copy_code_button: true
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/specmatic/docs.specmatic.io"
gh_edit_branch: "main"
gh_edit_view_mode: "edit"

compress_html:
  ignore:
    envs: all
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false

callouts:
  important:
    title: Important
    color: yellow
