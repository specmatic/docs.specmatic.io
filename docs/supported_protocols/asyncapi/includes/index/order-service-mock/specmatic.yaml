version: 3

dependencies:
  services:
    - service:
        $ref: "#/components/services/orderService"
        runOptions:
          "$ref": "#/components/runOptions/orderServiceMockOptions"
        data:
          examples:
            - directories:
                - "order-service_examples"

components:
  sources:
    centralContractRepo:
      filesystem:
        directory: "."
  services:
    orderService:
      description: "Order Service"
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/centralContractRepo"
            specs:
              - spec:
                  path: 'spec/order-service.yaml'

  runOptions:
    orderServiceMockOptions:
      asyncapi:
        type: mock
        servers:
          - host: "<SQS_QUEUE_URL>"
            protocol: sqs
            adminCredentials:
              aws.access.key.id: "<AWS_ACCESS_KEY_ID>"
              aws.secret.access.key: "<AWS_SECRET_ACCESS_KEY>"
          - host: "<KAFKA_BROKER_URL>"
            protocol: kafka

