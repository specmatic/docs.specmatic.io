version: 3
systemUnderTest:
  service:
    $ref: "#/components/services/asyncService"
    runOptions:
      $ref: "#/components/runOptions/asyncServiceTest"
components:
  sources:
    yourContracts:
      git:
        url: https://your-central-contract-repo.com
  services:
    asyncService:
      description: AsyncAPI Service
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/yourContracts"
            specs:
              - spec:
                  id: asyncSpec
                  path: spec/async-api-spec.yaml
  runOptions:
    asyncServiceTest:
      asyncapi:
        type: test
        servers:
          - server:
              host: amqp://localhost:5672
              protocol: amqp
              type: external
